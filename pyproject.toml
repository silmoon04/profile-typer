[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "profile-typer"
version = "0.2.0"
description = "A desktop queue for typing JSON descriptions into other applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Profile Typer contributors"}]
dependencies = [
  "PySide6-Essentials>=6.8.2,<6.10",
  "python-xlib>=0.33; sys_platform == 'linux'",
  "dbus-next>=0.2.3; sys_platform == 'linux'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Desktop Environment",
]

[project.gui-scripts]
profile-typer = "profile_typer.profile_typer_gui:main"

[project.scripts]
profile-typer-check = "profile_typer.smoke:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2", "hatchling>=1.27"]

[project.urls]
Homepage = "https://github.com/silmoon04/profile-typer"
Issues = "https://github.com/silmoon04/profile-typer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/profile_typer"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "packaging", "scripts", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["x11: requires a private X11 display with a window manager", "portal: exercises a private D-Bus portal fixture"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["UP035", "UP042"]
