name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: profile-typer-check --output artifacts/windows-smoke
      - run: python -m build
      - if: matrix.python == '3.12'
        run: |
          python -m pip install PyInstaller==6.22.2 PySide6-Essentials==6.9.3 pillow
          python scripts/build_windows.py
          $app = Get-ChildItem dist/windows/*/ProfileTyper/ProfileTyper.exe | Select-Object -First 1
          $check = Start-Process -FilePath $app.FullName -ArgumentList '--check', "$pwd/artifacts/frozen-smoke" -Wait -PassThru -WindowStyle Hidden
          if ($check.ExitCode -ne 0) { throw 'Packaged app check failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.python }}
          path: |
            artifacts/
            dist/

  debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-venv python3-pip python3-pytest python3-pyside6.qtwidgets python3-pyside6.qttest python3-xlib python3-dbus-next python3-build python3-hatchling qt6-wayland xdotool xvfb xauth openbox fonts-dejavu-core dbus-x11
      - name: Test source, X11 delivery, portal protocol, and installed deb
        run: sh scripts/test_debian.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debian-packages-and-smoke
          path: |
            artifacts/
            dist/
